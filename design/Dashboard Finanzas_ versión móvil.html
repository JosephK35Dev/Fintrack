<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas · Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060707;--surface:#0d0f0e;--raise:#151918;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--ink:#f3f6f4;--mute:#8a948f;--brand:#70d6a5;--neg:#ff7b7b;--gold:#ffd27b;--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif;--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060707}}
:root[data-theme="dark"]{--bg:#060707}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(120px + var(--sb));position:relative}
.glow{position:absolute;inset:0 0 auto;height:380px;background:radial-gradient(420px 300px at 50% -40px,rgba(112,214,165,.17),transparent 70%);pointer-events:none;z-index:-1}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.top p{color:var(--mute);font-size:13px}
.top h1{font:600 22px var(--display);letter-spacing:-.025em}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--mute);background:var(--surface)}
.mini{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:25;display:flex;justify-content:center;pointer-events:none;transform:translateY(-120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mini.on{transform:none}
.mini div{margin-top:8px;pointer-events:auto;background:rgba(13,15,14,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:999px;padding:8px 18px;font:600 15px var(--display);display:flex;gap:10px;align-items:center}
.mini small{font:400 12px var(--body);color:var(--mute)}
/* hero */
.hero{text-align:center;padding:26px 0 6px}
.hero .lbl{color:var(--mute);font-size:13.5px}
.big{font:600 clamp(44px,14vw,60px)/1.02 var(--display);letter-spacing:-.05em;margin:8px 0 14px;transition:filter .3s;display:inline-block;padding:2px 6px}
.big.hid{filter:blur(14px)}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;padding:7px 14px;border-radius:999px;background:rgba(112,214,165,.1);color:var(--brand)}
.pill.n{background:rgba(255,123,123,.1);color:var(--neg)}
.spark{margin:22px -16px 0;height:92px;position:relative;touch-action:pan-y}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.ln{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.4,0,.2,1) .2s forwards}
.ar{opacity:0;animation:fade 1s ease 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
.cur{stroke:var(--line2);stroke-dasharray:3 4;opacity:0}
.dt{fill:var(--brand);stroke:var(--bg);stroke-width:3;opacity:0}
.spark.t .cur,.spark.t .dt{opacity:1}
.stip{position:absolute;top:-4px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:3px 10px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none}
.spark.t .stip{opacity:1}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 28px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;min-height:84px;transition:transform .15s,border-color .2s}
.qa button:active{border-color:var(--brand)}
.qa .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center}
.g{background:rgba(112,214,165,.12);color:var(--brand)}.r{background:rgba(255,123,123,.12);color:var(--neg)}.y{background:rgba(255,210,123,.12);color:var(--gold)}
/* sections */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec h2{font:600 18px var(--display);letter-spacing:-.02em}
.sec span{font-size:13px;color:var(--mute)}
section{margin-bottom:30px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.w{flex:0 0 72%;scroll-snap-align:center;border-radius:24px;padding:18px;border:1px solid var(--line);background:var(--surface);min-height:130px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s,opacity .25s}
.w:first-child{background:linear-gradient(150deg,#12231a,var(--surface) 70%)}
.w .r1{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.w .d{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(112,214,165,.15)}.w .d.off{background:#3a413d;box-shadow:none}
.w b{font:600 24px var(--display);letter-spacing:-.03em;display:block}
.w small{color:var(--mute);font-size:12px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line2);transition:.3s}.dots i.on{width:18px;background:var(--brand)}
/* hoy */
.today{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:18px}
.trow{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:rgba(255,255,255,.07)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--display)}
.trow h3{font:600 16px var(--display)}.trow p{font-size:13px;color:var(--gold);display:flex;gap:5px;align-items:center;margin-top:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--raise);text-align:left;min-height:56px;font-size:13.5px;line-height:1.25;transition:.25s}
.chip .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent;transition:.25s}
.chip.done{border-color:rgba(112,214,165,.4);background:rgba(112,214,165,.08)}
.chip.done .k{background:var(--brand);border-color:var(--brand);color:#05100a}
.chip.done span:last-child{color:var(--mute)}
.tk{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.tk .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;transition:.25s}
.tk.done .k{background:var(--brand);border-color:var(--brand);color:#05100a}
.tk.done .t{color:var(--mute);text-decoration:line-through}
.tk .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{width:8px;height:8px;border-radius:50%;flex:none}
.tk small{color:var(--mute);font-size:12px}
.tkh{margin-top:16px;font-size:13px;color:var(--mute)}
/* movs */
.day{font-size:12.5px;color:var(--mute);margin:14px 2px 6px}
.mv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.mv .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.mv .m{flex:1;min-width:0}.mv p{font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mv small{color:var(--mute);font-size:12px}
.amt{font:600 15px var(--display)}.amt.p{color:var(--brand)}.amt.n{color:var(--neg)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* categorias */
.cats{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:18px}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1),opacity .2s}
.cl{margin-top:14px}
.cr{display:flex;align-items:center;gap:10px;padding:11px 4px;font-size:14px;width:100%;text-align:left;border-top:1px solid var(--line);min-height:46px;transition:opacity .2s}
.cr:first-child{border:0}.cr i{width:10px;height:10px;border-radius:4px;flex:none}.cr em{margin-left:auto;font-style:normal;color:var(--mute)}
.cats.f .bar i:not(.hl),.cats.f .cr:not(.hl){opacity:.3}
.moto{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.moto .im{width:84px;aspect-ratio:16/10;border-radius:14px;background:radial-gradient(circle at 70% 30%,rgba(112,214,165,.2),transparent 60%),var(--raise);display:grid;place-items:center;color:var(--brand);flex:none}
.moto h3{font:600 16px var(--display)}.moto p{font-size:12.5px;color:var(--mute);margin-top:2px}
/* nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 16px calc(10px + var(--sb));pointer-events:none}
.dock nav{pointer-events:auto;width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;background:rgba(13,15,14,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:28px;padding:6px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8)}
.dock nav>button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:var(--mute);border-radius:20px;min-height:52px;transition:color .2s}
.dock nav>button.on{color:var(--brand)}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px!important;background:var(--brand);color:#05100a!important;margin-top:-26px;box-shadow:0 12px 30px -6px rgba(112,214,165,.7),0 0 0 6px var(--bg);display:grid!important;place-items:center;padding:0!important;transition:transform .25s!important}
.fab:active{transform:scale(.92) rotate(90deg)}
/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 20px calc(20px + var(--sb));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--raise);border-radius:16px;position:relative}
.seg button{padding:11px;border-radius:12px;font-weight:500;color:var(--mute);position:relative;z-index:1;transition:color .25s;min-height:44px}
.seg button.on{color:#05100a}
.seg i{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;border-radius:12px;background:var(--brand);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.seg.neg i{transform:translateX(100%);background:var(--neg)}
.amtin{display:block;width:100%;text-align:center;background:none;border:0;color:var(--ink);font:600 46px var(--display);letter-spacing:-.04em;margin:22px 0 4px;outline:none;caret-color:var(--brand)}
.amtin::placeholder{color:#3a413d}
.fld{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);padding:0 16px;font:inherit;font-size:16px;margin-top:10px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld:focus{border-color:rgba(112,214,165,.5);box-shadow:0 0 0 4px rgba(112,214,165,.1)}
.cta{width:100%;min-height:54px;border-radius:18px;background:var(--brand);color:#05100a;font-weight:600;font-size:16px;margin-top:16px;box-shadow:0 12px 30px -10px rgba(112,214,165,.6);transition:opacity .2s,transform .15s}
.cta:disabled{opacity:.35;box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translate(-50%,30px);opacity:0;z-index:50;background:var(--raise);border:1px solid var(--line2);border-radius:999px;padding:10px 18px;font-size:14px;display:flex;gap:8px;align-items:center;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){body{background:#030404}.app{border-inline:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.ln{stroke-dashoffset:0}.ar{opacity:1}}
</style>
</head>
<body>
<div class="mini" id="mini"><div><small>Balance</small><span id="mv"></span></div></div>
<div class="app">
  <div class="glow"></div>
  <header class="top">
    <div><p id="fecha"></p><h1 id="saludo"></h1></div>
    <button class="round" id="eye" aria-label="Ocultar montos" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>

  <div class="hero" id="hero">
    <p class="lbl">Balance total</p>
    <div class="big" id="big">$ 0</div><br>
    <span class="pill" id="pill"></span>
    <div class="spark" id="spark"><svg viewBox="0 0 400 92" preserveAspectRatio="none" aria-label="Balance de los últimos 30 días">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#70d6a5" stop-opacity=".3"/><stop offset="1" stop-color="#70d6a5" stop-opacity="0"/></linearGradient></defs>
      <path class="ar" id="ar" fill="url(#g)"/><path class="ln" id="ln" pathLength="1" vector-effect="non-scaling-stroke"/><line class="cur" id="cur" y1="0" y2="92" vector-effect="non-scaling-stroke"/></svg><div class="stip" id="stip"></div></div>
  </div>

  <div class="qa">
    <button data-open="ingreso"><span class="ic g"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M17 17H7V7"/></svg></span>Ingreso</button>
    <button data-open="gasto"><span class="ic r"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg></span>Gasto</button>
    <button id="tr"><span class="ic y"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg></span>Transferir</button>
  </div>

  <section><div class="sec"><h2>Carteras</h2><span id="wn"></span></div><div class="rail" id="rail"></div><div class="dots" id="dots"></div></section>

  <section><div class="sec"><h2>Hoy</h2><span id="hd"></span></div>
    <div class="today">
      <div class="trow"><div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="fg" cx="32" cy="32" r="27" stroke-dasharray="170" stroke-dashoffset="170"/></svg><div id="rv"></div></div>
        <div><h3>Hábitos de hoy</h3><p><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 1-6 1-9z"/></svg>Racha más alta: 12 días</p></div></div>
      <div class="chips" id="habs"></div>
      <p class="tkh" id="tsub"></p><div id="tasks"></div>
    </div></section>

  <section><div class="sec"><h2>Recientes</h2><span>Ver todos</span></div><div id="movs"></div></section>

  <section><div class="sec"><h2>Gastos por categoría</h2></div>
    <div class="cats" id="cats"><div class="bar" id="bar"></div><div class="cl" id="cl"></div></div></section>

  <section><div class="sec"><h2>Mi moto</h2></div>
    <button class="moto"><div class="im"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M15 6h3l1 5M5.5 17 9 9h5l3 5M9 9 8 6H6"/></svg></div>
      <div style="flex:1"><h3>Pulsar NS160 FI</h3><p>12.480 km, aceite el 12 sep</p></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a948f" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button></section>
</div>

<div class="dock"><nav aria-label="Principal">
  <button class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movs</button>
  <button class="fab" data-open="gasto" aria-label="Nuevo movimiento"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Metas</button>
  <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
</nav></div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sh" role="dialog" aria-label="Nuevo movimiento">
  <div class="grab"></div>
  <div class="seg" id="seg"><i></i><button data-t="gasto" class="on">Gasto</button><button data-t="ingreso">Ingreso</button></div>
  <input class="amtin" id="am" inputmode="numeric" placeholder="$ 0" autocomplete="off" aria-label="Monto">
  <input class="fld" id="ds" placeholder="Descripción" aria-label="Descripción">
  <select class="fld" id="ct" aria-label="Categoría"><option>Comida</option><option>Transporte</option><option>Vivienda</option><option>Ocio</option><option>Otros</option></select>
  <button class="cta" id="sv" disabled>Guardar movimiento</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $=i=>document.getElementById(i),COP=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let hidden=false,tipo='gasto';
const D={total:4872350,ing:3200000,gas:1845200,
carts:[['Bancolombia',2450000,1],['Nequi',612350,1],['Efectivo',310000,1],['Ahorros viaje',1500000,0]],
habs:[['Leer 10 minutos',1],['Entrenar',0],['Beber 2 litros de agua',1],['Meditar',0]],
tasks:[['Pagar el recibo de la luz','alta',0],['Revisar presión de llantas','media',0],['Planear diciembre','baja',0]],
movs:[['Salario noviembre','Hoy','Bancolombia',3200000,1],['Mercado','Hoy','Nequi',186400,0],['Gasolina','Ayer','Efectivo',42000,0],['Suscripción de música','Ayer','Bancolombia',17900,0],['Freelance logo','3 nov','Nequi',480000,1]],
cats:[['Comida',620000,'#70d6a5'],['Transporte',410000,'#3fa37a'],['Vivienda',380000,'#9fe8c4'],['Ocio',235200,'#2f7d5c'],['Otros',200000,'#56615b']]};
const now=new Date(),h=now.getHours(),m=n=>hidden?'$ ••••••':COP(n);
$('fecha').textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(now);
$('saludo').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+', Joseph';
const chk='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const vib=()=>navigator.vibrate&&navigator.vibrate(8);
function countUp(){if(reduce){$('big').textContent=m(D.total);return}const t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/1300);$('big').textContent=m(D.total*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function paint(){
 $('big').textContent=m(D.total);$('mv').textContent=m(D.total);
 $('pill').className='pill'+(D.ing-D.gas<0?' n':'');$('pill').innerHTML='Este mes <b>'+(D.ing-D.gas<0?'':'+')+m(D.ing-D.gas)+'</b>';
 $('wn').textContent=D.carts.length+' carteras';
 $('rail').innerHTML=D.carts.map(c=>`<div class="w"><div class="r1"><span>${c[0]}</span><i class="d ${c[2]?'':'off'}"></i></div><div><b>${m(c[1])}</b><small>${c[2]?'En tu balance':'Fuera del balance'}</small></div></div>`).join('');
 $('dots').innerHTML=D.carts.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
 let last='',out='';D.movs.forEach((x,i)=>{if(x[1]!==last){out+=`<p class="day">${x[1]}</p>`;last=x[1]}
 out+=`<div class="mv" style="animation-delay:${i*50}ms"><span class="ic ${x[4]?'g':'r'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${x[4]?'<path d="M17 7 7 17M17 17H7V7"/>':'<path d="M7 17 17 7M7 7h10v10"/>'}</svg></span><div class="m"><p>${x[0]}</p><small>${x[2]}</small></div><span class="amt ${x[4]?'p':'n'}">${x[4]?'+':'−'}${m(x[3])}</span></div>`});
 $('movs').innerHTML=out}
$('eye').onclick=()=>{hidden=!hidden;$('eye').setAttribute('aria-pressed',hidden);$('big').classList.toggle('hid',hidden);paint();vib()};
$('rail').addEventListener('scroll',e=>{const r=e.target,i=Math.round(r.scrollLeft/(r.scrollWidth/D.carts.length));[...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true});
/* sparkline táctil */
const P=[];let v=D.total-1100000;for(let i=0;i<30;i++){v+=Math.sin(i*.8)*60000+(i%7===0?-90000:50000)+i*4000;P.push(v)}P[29]=D.total;
const mn=Math.min(...P),mx=Math.max(...P),X=i=>i/29*400,Y=p=>82-(p-mn)/(mx-mn)*66,dd=P.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1)).join(' ');
$('ln').setAttribute('d',dd);$('ar').setAttribute('d',dd+' L400 92 L0 92Z');
const sp=$('spark'),mv=e=>{const r=sp.getBoundingClientRect(),i=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*29);sp.classList.add('t');$('cur').setAttribute('x1',X(i));$('cur').setAttribute('x2',X(i));
 const d=new Date(now);d.setDate(d.getDate()-(29-i));$('stip').style.left=(i/29*100)+'%';$('stip').textContent=d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+', '+m(P[i])};
sp.addEventListener('pointerdown',mv);sp.addEventListener('pointermove',e=>sp.classList.contains('t')&&mv(e));['pointerup','pointerleave','pointercancel'].forEach(k=>sp.addEventListener(k,()=>sp.classList.remove('t')));
/* hábitos y tareas */
function habs(){const dn=D.habs.filter(x=>x[1]).length;$('fg').style.strokeDashoffset=170*(1-dn/D.habs.length);$('rv').textContent=dn+'/'+D.habs.length;$('hd').textContent=dn===D.habs.length?'Completo':'Faltan '+(D.habs.length-dn);
 $('habs').innerHTML=D.habs.map((x,i)=>`<button class="chip ${x[1]?'done':''}" data-i="${i}"><span class="k">${chk}</span><span>${x[0]}</span></button>`).join('');
 $('habs').querySelectorAll('button').forEach(b=>b.onclick=()=>{D.habs[b.dataset.i][1]^=1;vib();habs()})}
function tasks(){const o=D.tasks.filter(t=>!t[2]).length;$('tsub').textContent=o?o+(o===1?' tarea pendiente':' tareas pendientes'):'Todo al día';
 const c={alta:'var(--neg)',media:'var(--gold)',baja:'var(--brand)'};
 $('tasks').innerHTML=D.tasks.map((t,i)=>`<button class="tk ${t[2]?'done':''}" data-i="${i}"><span class="k">${chk}</span><span class="t">${t[0]}</span><i class="pr" style="background:${c[t[1]]}"></i></button>`).join('');
 $('tasks').querySelectorAll('button').forEach(b=>b.onclick=()=>{D.tasks[b.dataset.i][2]^=1;vib();tasks()})}
/* categorías */
const tot=D.cats.reduce((a,c)=>a+c[1],0);
$('bar').innerHTML=D.cats.map((c,i)=>`<i data-i="${i}" style="background:${c[2]}"></i>`).join('');
$('cl').innerHTML=D.cats.map((c,i)=>`<button class="cr" data-i="${i}"><i style="background:${c[2]}"></i>${c[0]}<em>${COP(c[1])}</em></button>`).join('');
const hl=i=>{$('cats').classList.toggle('f',i!=null);document.querySelectorAll('#cats [data-i]').forEach(e=>e.classList.toggle('hl',e.dataset.i==i))};
document.querySelectorAll('#cats [data-i]').forEach(e=>{e.addEventListener('pointerdown',()=>hl(e.dataset.i));['pointerup','pointerleave','pointercancel'].forEach(k=>e.addEventListener(k,()=>hl(null)))});
/* hoja de nuevo movimiento */
const open=t=>{setT(t);$('ov').classList.add('on');$('sh').classList.add('on');setTimeout(()=>$('am').focus({preventScroll:true}),350)},close=()=>{$('ov').classList.remove('on');$('sh').classList.remove('on');document.activeElement.blur()};
function setT(t){tipo=t;$('seg').classList.toggle('neg',t==='gasto'?false:false);$('seg').style.setProperty('--x',0);
 $('seg').classList.toggle('neg',t==='ingreso'?false:false);
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('seg').classList.toggle('neg',t==='gasto')}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{setT(b.dataset.t);vib()});
$('seg').classList.add('neg');
$('tr').onclick=()=>toast('Transferir llegará en la versión completa');
$('ov').onclick=close;
const val=()=>$('sv').disabled=!(+$('am').value.replace(/\D/g,'')>0&&$('ds').value.trim());
$('am').oninput=e=>{const n=e.target.value.replace(/\D/g,'');e.target.value=n?COP(+n):'';val()};$('ds').oninput=val;
$('sv').onclick=()=>{const n=+$('am').value.replace(/\D/g,''),ing=tipo==='ingreso';
 D.movs.unshift([$('ds').value.trim(),'Hoy','Bancolombia',n,ing?1:0]);ing?(D.ing+=n,D.total+=n):(D.gas+=n,D.total-=n);
 $('am').value='';$('ds').value='';val();close();paint();vib();toast((ing?'Ingreso':'Gasto')+' guardado')};
let tt;function toast(t){const e=$('toast');e.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#70d6a5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'+t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
/* mini balance al hacer scroll */
new IntersectionObserver(([e])=>$('mini').classList.toggle('on',!e.isIntersecting),{rootMargin:'-70px 0px 0px 0px'}).observe($('big'));
countUp();paint();habs();tasks();
requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('#bar i').forEach((b,i)=>b.style.width=D.cats[i][1]/tot*100+'%'),80));
</script>
</body>
</html>
